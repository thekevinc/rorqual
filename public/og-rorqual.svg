<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Rorqual tools for money and markets</title>
  <desc id="description">A dark branded social card for Rorqual and its finance tools.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06" />
    </pattern>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5be9b9" stop-opacity="0.18" />
      <stop offset="1" stop-color="#5be9b9" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0b0d" />
  <rect width="1200" height="630" fill="url(#dots)" />
  <circle cx="1040" cy="90" r="390" fill="url(#accentGlow)" />

  <text x="92" y="112" fill="#5be9b9" font-family="Courier New, monospace" font-size="21" font-weight="700" letter-spacing="6">RORQUAL</text>
  <text x="92" y="238" fill="#ecedf0" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700">Tools for money</text>
  <text x="92" y="326" fill="#ecedf0" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700">and <tspan fill="#5be9b9">markets</tspan></text>
  <text x="92" y="382" fill="#9ba1ab" font-family="Arial, Helvetica, sans-serif" font-size="26">Focused analyzers for financial decisions and market research.</text>

  <g transform="translate(92 438)">
    <rect width="470" height="88" rx="12" fill="#14161a" stroke="#2f343c" stroke-width="2" />
    <circle cx="42" cy="44" r="15" fill="#5be9b9" />
    <text x="76" y="39" fill="#ecedf0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Rent vs Buy Calculator</text>
    <text x="76" y="66" fill="#9ba1ab" font-family="Arial, Helvetica, sans-serif" font-size="17">Housing decisions and opportunity cost</text>
  </g>
  <g transform="translate(582 438)">
    <rect width="470" height="88" rx="12" fill="#14161a" stroke="#2f343c" stroke-width="2" />
    <circle cx="42" cy="44" r="15" fill="#f5b14c" />
    <text x="76" y="39" fill="#ecedf0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Whale Watch</text>
    <text x="76" y="66" fill="#9ba1ab" font-family="Arial, Helvetica, sans-serif" font-size="17">Polymarket opportunities and smart money</text>
  </g>

  <text x="92" y="583" fill="#5d6470" font-family="Courier New, monospace" font-size="20">rorqual.xyz</text>
</svg>
